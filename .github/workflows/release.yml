name: Release

# Cuts a versioned GitHub Release with a signed APK whenever a real change lands on main
# (skips docs/chore/ci/etc. commits). Manual runs allowed via the Actions tab.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  release:
    if: |
      github.event_name == 'workflow_dispatch' || (
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !startsWith(github.event.head_commit.message, 'chore:') &&
        !startsWith(github.event.head_commit.message, 'docs:') &&
        !startsWith(github.event.head_commit.message, 'ci:') &&
        !startsWith(github.event.head_commit.message, 'build:') &&
        !startsWith(github.event.head_commit.message, 'style:') &&
        !startsWith(github.event.head_commit.message, 'test:')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Compute next version
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | grep '^v' | head -1)
          if [ -z "$LATEST" ]; then LATEST="v0.0.0"; fi
          BUMPED=$(git cliff --bumped-version 2>/dev/null || echo "")
          version_gte() { [ "$(printf '%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }
          if [ -z "$BUMPED" ] || ! version_gte "$BUMPED" "$LATEST" || [ "$BUMPED" = "$LATEST" ]; then
            LATEST_VER="${LATEST#v}"
            IFS='.' read -r major minor patch <<< "$LATEST_VER"
            BUMPED="v${major}.${minor}.$((patch+1))"
          fi
          while git tag | grep -qx "$BUMPED"; do
            VER="${BUMPED#v}"
            IFS='.' read -r major minor patch <<< "$VER"
            BUMPED="v${major}.${minor}.$((patch+1))"
          done
          echo "new_tag=$BUMPED" >> $GITHUB_OUTPUT

      - name: Extract release notes
        id: notes
        run: |
          NOTES=$(git cliff --tag ${{ steps.version.outputs.new_tag }} --unreleased --strip header)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Tag release
        run: |
          git tag ${{ steps.version.outputs.new_tag }}
          git push origin ${{ steps.version.outputs.new_tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.keystore

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Crumpet Companion ${{ steps.version.outputs.new_tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
